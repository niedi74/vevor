; Display-Test für Guition ESP32-4848S040 (4" 480x480 ST7701, GT911 Touch)
; Basiert auf https://github.com/ha5dzs/Guition-ESP32-4848S040-platformio
; Flash: pio run -t upload -t monitor
[env:guition-4848s040-test]
platform = espressif32
framework = arduino
board = esp32-s3-devkitm-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_upload.maximum_size = 16777216
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    https://github.com/moononournation/Arduino_GFX
    lvgl/lvgl @ ^8.4.0
    https://github.com/tamctec/gt911-arduino
